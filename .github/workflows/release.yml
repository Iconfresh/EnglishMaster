
name: Shepherd English Master Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-26

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --yes --no-progress

      - name: Build application
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Copy application dependencies
        run: mvn --batch-mode --no-transfer-progress dependency:copy-dependencies -DoutputDirectory=target/dependency

      - name: Prepare application input
        shell: bash
        run: |
          mkdir -p target/app-input
          cp target/english-master-1.0.0.jar target/app-input/


      - name: Build custom JavaFX runtime
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MODULE_PATH="$JAVA_HOME/jmods;target/dependency"
          else
            MODULE_PATH="$JAVA_HOME/jmods:target/dependency"
          fi

          jlink \
            --module-path "$MODULE_PATH" \
            --add-modules javafx.controls,javafx.media \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --output target/runtime

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          jpackage \
            --type exe \
            --name "Shepherd English Master" \
            --app-version 1.0.0 \
            --vendor "Shepherd" \
            --input target/app-input \
            --main-jar english-master-1.0.0.jar \
            --main-class EnglishMasterApp \
            --runtime-image target/runtime \
            --icon packaging/icons/shepherd-icon.ico \
            --java-options "--add-modules=javafx.controls,javafx.media" \
            --win-menu \
            --win-shortcut \
            --dest target/installer

      - name: Create macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          jpackage \
            --type dmg \
            --name "Shepherd English Master" \
            --app-version 1.0.0 \
            --vendor "Shepherd" \
            --input target/app-input \
            --main-jar english-master-1.0.0.jar \
            --main-class EnglishMasterApp \
            --runtime-image target/runtime \
            --icon packaging/icons/ShepherdIcon.icns \
            --java-options "--add-modules=javafx.controls,javafx.media" \
            --mac-package-name Shepherd \
            --dest target/installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Shepherd-English-Master-${{ matrix.name }}
          path: target/installer/*
          if-no-files-found: error
          retention-days: 14



